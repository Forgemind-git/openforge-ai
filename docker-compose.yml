# OpenForge AI — run it anywhere:  cp .env.example .env && docker compose up -d
# Then open http://localhost:3000 (or your PUBLIC_URL) and create the admin account.
services:
  openforge:
    build: .
    image: openforge-ai:latest
    container_name: openforge
    restart: unless-stopped
    env_file: .env
    ports:
      - "${OPENFORGE_PORT:-3000}:3000"
    volumes:
      - openforge-data:/data

volumes:
  openforge-data:
